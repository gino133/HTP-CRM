name: Build HTP CRM Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout source code
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Node.js 22
      # Capacitor 8 requires Node.js >= 22
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ==========================================
      # 3. Java 21
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ==========================================
      # 4. Check versions
      # ==========================================
      - name: Check environment
        run: |
          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version

          echo "Java version:"
          java -version

      # ==========================================
      # 5. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: npm ci

      # ==========================================
      # 6. Build Vite application
      # ==========================================
      - name: Build web application
        run: npm run build

      # ==========================================
      # 7. Sync Capacitor
      # ==========================================
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ==========================================
      # 8. Give Gradle permission
      # ==========================================
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ==========================================
      # 9. Build Android Debug APK
      # ==========================================
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # ==========================================
      # 10. Prepare APK
      # ==========================================
      - name: Prepare APK
        run: |
          mkdir -p release

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/HTP-CRM-debug.apk

      # ==========================================
      # 11. Upload APK to GitHub
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTP-CRM-Android
          path: release/HTP-CRM-debug.apk
          if-no-files-found: error
          retention-days: 30
