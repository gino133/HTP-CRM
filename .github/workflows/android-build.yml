name: Build HTP CRM Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cài Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Cài Java cho Android Gradle
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4. Cài dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Build React/Vite
      - name: Build web application
        run: npm run build

      # 6. Đồng bộ web app vào Android
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 7. Cấp quyền chạy Gradle
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 8. Build APK Debug
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # 9. Đổi tên APK cho dễ nhận biết
      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/HTP-CRM-debug.apk

      # 10. Upload APK lên GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTP-CRM-Android
          path: release/HTP-CRM-debug.apk
          if-no-files-found: error
          retention-days: 30
